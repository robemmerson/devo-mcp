name: Bug
description: Something the server or a tool does wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Keep your own data out of this issue**: redact usernames, host names, IPs, tenant or
        account ids, and query results. Security problems go through the repository's
        **Security** tab, not a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: call
    attributes:
      label: Tool call
      description: The tool, its parameters (redacted), and the error or the `messages` it returned.
      render: json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From `devo_check` → `server.version` and `server.engine.commit`.
      placeholder: 0.2.1, engine c8d5b0b
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: How it runs
      options:
        - stdio
        - HTTP
        - Docker
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Desktop, n8n, …
  - type: checkboxes
    id: redacted
    attributes:
      label: Data check
      options:
        - label: This issue contains no real data from my Devo domain.
          required: true
