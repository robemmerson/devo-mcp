name: Release

# On every push to main (a merged PR): work out the next version from the Conventional Commits
# since the last tag (scripts/release.py), tag the merge commit vX.Y.Z, publish a GitHub release,
# push ghcr.io/<owner>/devo-mcp:{X.Y.Z, X.Y, latest, sha-…} (linux/amd64), and note the release on the PR.
# docs/ci/test/chore-only merges don't release. Optional mirror: with the MIRROR_IMAGE
# ([<registry>/]<namespace>/<name>), MIRROR_USERNAME and MIRROR_TOKEN repository secrets, the same tags
# are pushed there too.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  plan:
    # Releases come from main only, including manual runs: never from an unreviewed branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Tests
        run: |
          uv sync --frozen --extra dev
          uv run pytest -q
      - name: Plan
        id: plan
        run: |
          python3 scripts/release.py plan > plan.json
          cat plan.json
          {
            echo "release=$(jq -r .release plan.json)"
            echo "version=$(jq -r '.version // ""' plan.json)"
            echo "tag=$(jq -r '.tag // ""' plan.json)"
          } >> "$GITHUB_OUTPUT"
          jq -r '.notes // ""' plan.json > notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md

  image:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to ghcr.io
    env:
      MIRROR_IMAGE: ${{ secrets.MIRROR_IMAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stamp version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python3 scripts/release.py stamp "$VERSION"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image names
        id: names
        run: |
          registry="${MIRROR_IMAGE%%/*}"
          case "$registry" in  # Docker's rule: no dot, colon or localhost means the default registry
            *.*|*:*|localhost) ;;
            *) registry=docker.io ;;
          esac
          if [ -n "$MIRROR_IMAGE" ]; then echo "::add-mask::$registry"; fi
          {
            echo "mirror_registry=$registry"
            echo "images<<EOF"
            echo "${IMAGE,,}"
            if [ -n "$MIRROR_IMAGE" ]; then echo "$MIRROR_IMAGE"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - if: env.MIRROR_IMAGE != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.names.outputs.mirror_registry }}
          username: ${{ secrets.MIRROR_USERNAME }}
          password: ${{ secrets.MIRROR_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  publish:
    needs: [plan, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # tag + GitHub release
      pull-requests: write   # comment on the merged PR
      issues: write          # create and add the "released" label
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
      - name: Tag and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          tag="$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          IMAGE="${IMAGE,,}"
          git tag -a "$tag" -m "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          # shellcheck disable=SC2016 # the backticks are markdown, not command substitution
          { cat notes.md; printf '\n\n### Container\n\n```sh\ndocker pull %s:%s\n```\n' "$IMAGE" "${tag#v}"; } > release.md
          gh release create "$tag" --title "devo-mcp $tag" --notes-file release.md --verify-tag
      - name: Note the release on the merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          tag="$TAG"
          IMAGE="${IMAGE,,}"
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then echo "no PR for $GITHUB_SHA (direct push)"; exit 0; fi
          gh label create released --color 0e8a16 --description "Included in a published release" 2>/dev/null || true
          gh pr edit "$pr" --add-label released
          gh pr comment "$pr" --body "Released in [$tag](https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag): \`docker pull $IMAGE:${tag#v}\`"
