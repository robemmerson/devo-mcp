[project]
name = "devo-mcp"
version = "1.0.0"
description = "MCP server for the Devo SIEM: LINQ queries, alert triage, investigations and Activeboards"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
dependencies = [
    "mcp==2.3.0",
    "uvicorn>=0.30",
    "starlette>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
devo-mcp = "devo_mcp.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: needs a real Devo token (read-only calls); run with DEVO_MCP_LIVE_TESTS=1"]
